name: Windows V2 desktop assistant build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: windows-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Verify single-source application and templates
        shell: pwsh
        run: |
          if (!(Test-Path "app.py")) { throw "app.py is missing" }
          if (!(Test-Path "result_dialog.py")) { throw "result_dialog.py is missing" }
          if (!(Test-Path "assets/result_dialog_template.png")) { throw "result dialog template is missing" }
          if (!(Test-Path "assets/confirm_button_template.png")) { throw "confirm button template is missing" }
          if (Test-Path "inminigame_assistant.py") { throw "Legacy application source must not be present." }
          if (Test-Path ".build") { throw "Obsolete hidden source bundle must not be present." }

      - name: Compile active application sources
        run: python -m compileall -q app.py tracker.py gpu_backend.py result_dialog.py tools

      - name: Run tracker and reference-dialog regression tests
        run: pytest -q

      - name: Build Windows desktop application from repository sources
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name "MapleStoryMiniGameAssistant"
          --collect-all cv2 --collect-all pyopencl --collect-all mss --collect-all pyautogui
          --add-data "assets;assets"
          app.py

      - name: Write build provenance and dependency manifest
        shell: pwsh
        run: |
          $sourceFiles = @(
            "app.py",
            "tracker.py",
            "gpu_backend.py",
            "result_dialog.py",
            "requirements.txt",
            "assets/result_dialog_template.png",
            "assets/confirm_button_template.png"
          )
          $hashes = @{}
          foreach ($file in $sourceFiles) {
            $hashes[$file] = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
          }
          python -m pip freeze | Set-Content -Path "dist/MapleStoryMiniGameAssistant/dependency-freeze.txt" -Encoding utf8
          $manifest = [ordered]@{
            commit_sha = "${{ github.sha }}"
            python = (python --version 2>&1)
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            test_status = "passed"
            source_sha256 = $hashes
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "dist/MapleStoryMiniGameAssistant/build-info.json" -Encoding utf8

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: MapleStory-MiniGameAssistant-V2-Windows
          path: dist/MapleStoryMiniGameAssistant/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
