name: Windows CUDA build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128
          pip install pytest pyinstaller
      - name: Verify CUDA-enabled PyTorch runtime is installed
        run: |
          python -c "import torch; print('PyTorch:', torch.__version__); print('CUDA runtime:', torch.version.cuda); assert torch.version.cuda is not None"
      - name: Run tests
        run: pytest -q
      - name: Build CUDA-enabled Windows application
        run: pyinstaller --noconfirm --clean --onedir --windowed --name WhiteTargetAssistant --collect-all torch --collect-all nvidia --collect-all cv2 --collect-all mss --collect-all pyautogui app.py
      - name: Upload CUDA-enabled application
        uses: actions/upload-artifact@v4
        with:
          name: WhiteTargetAssistant-CUDA-windows
          path: dist/WhiteTargetAssistant/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
