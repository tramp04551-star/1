name: Windows build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
      - name: Run tests
        run: pytest -q
      - name: Build executable
        run: pyinstaller --noconfirm --onefile --windowed --name WhiteTargetAssistant app.py
      - uses: actions/upload-artifact@v4
        with:
          name: WhiteTargetAssistant-windows
          path: dist/WhiteTargetAssistant.exe
          if-no-files-found: error
