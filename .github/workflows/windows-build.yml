name: Windows cross-vendor GPU build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run automated tests
        run: pytest -q
      - name: Build Windows desktop application
        run: pyinstaller --noconfirm --clean --onedir --windowed --name "MapleStoryMiniGameAssistant" --collect-all cv2 --collect-all pyopencl --collect-all mss --collect-all pyautogui app.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: MapleStory-MiniGameAssistant-Windows
          path: dist/MapleStoryMiniGameAssistant/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
