name: Windows build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
      - name: Run tests
        run: pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WhiteTargetAssistant --collect-all cv2 --collect-all mss --collect-all pyautogui app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WhiteTargetAssistant-windows
          path: dist/WhiteTargetAssistant.exe
          if-no-files-found: error
